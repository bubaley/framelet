name: Check and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framelet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit('Release tag must match the stable project version')
          PY

  docker:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test in Linux container
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: framelet:ci
          cache-from: type=gha
      - name: Smoke test runtime image
        run: |
          docker run -d --name framelet-ci \
            -p 127.0.0.1:8000:8000 --shm-size 256m --memory 1g --cpus 2 \
            --read-only --tmpfs /tmp:rw,nosuid,size=256m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e FRAMELET_API_TOKEN=ci-only-token-not-for-production framelet:ci
          python scripts/smoke.py
      - name: Container logs
        if: always()
        run: docker logs framelet-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f framelet-ci || true

  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'bubaley' }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || 'bubaley/framelet' }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha
          flavor: latest=false
      - name: Publish to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
