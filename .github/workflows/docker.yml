name: CI and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to republish (leave empty for normal main releases)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: framelet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: uv run python scripts/verify_release.py

  docker:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Test in Linux container
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: framelet:ci
          cache-from: type=gha
      - name: Smoke test runtime image
        run: |
          docker run -d --name framelet-ci \
            -p 127.0.0.1:8000:8000 --shm-size 256m --memory 1g --cpus 2 \
            --read-only --tmpfs /tmp:rw,nosuid,size=256m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e FRAMELET_API_TOKEN=ci-only-token-not-for-production framelet:ci
          python scripts/smoke.py
      - name: Container logs
        if: always()
        run: docker logs framelet-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f framelet-ci || true

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.release_tag == ''
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: framelet-release
      cancel-in-progress: false
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify tested commit is still current
        id: head
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            git checkout -B main
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit will be released by its own workflow.'
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.head.outputs.current == 'true'
        with:
          version: '0.9.2'
          enable-cache: true
      - name: Prepare release environment
        if: steps.head.outputs.current == 'true'
        run: |
          uv sync --locked --python 3.13
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Create version, changelog, tag and GitHub Release
        if: steps.head.outputs.current == 'true'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==10.7.0 semantic-release version

  publish:
    if: >-
      always() && needs.docker.result == 'success' &&
      (needs.release.outputs.released == 'true' || startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs: [docker, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || inputs.release_tag || github.ref }}
      - name: Verify versioned checkout
        id: version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.release_tag || github.ref_name }}
        run: python scripts/verify_release.py
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/framelet', github.repository_owner) }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          flavor: latest=false
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Publish to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
