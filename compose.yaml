services:
  framelet:
    image: bubaley/framelet:${FRAMELET_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      FRAMELET_API_TOKEN: ${FRAMELET_API_TOKEN:?Set FRAMELET_API_TOKEN in .env}
    ports:
      - "${FRAMELET_BIND_ADDRESS:-127.0.0.1}:${FRAMELET_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    shm_size: 256m
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
