[project]
name = "framelet"
version = "0.1.0"
description = "Synchronous video previews rendered with Chromium"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "playwright==1.57.0",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2.13.1",
    "mypy>=1.15,<2",
    "pillow>=11,<13",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framelet"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: exercises the installed Chromium browser"]
